<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121b2a"><link rel="manifest" href="manifest.webmanifest"><title>Hadish Works Manager</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eaf0f8;background:#0d1420}*{box-sizing:border-box}body{margin:0}header{padding:22px 18px 14px;background:#121b2a;border-bottom:1px solid #29364b}h1{font-size:21px;margin:0}h2{font-size:19px}h3{font-size:15px;margin:0 0 10px}.muted,small{color:#9eacc0}.brand{color:#72c9b2;font-size:12px;font-weight:700;letter-spacing:2px}main{max-width:850px;margin:auto;padding:16px 16px 100px}.tabs{display:flex;overflow-x:auto;gap:7px;padding:12px 14px;background:#121b2a;position:sticky;top:0;z-index:2}.tabs button{white-space:nowrap}.tabs button.active{background:#4ebba3;color:#0d1420}button{border:0;border-radius:11px;padding:11px 14px;background:#26354a;color:#f2f6ff;font-weight:650;cursor:pointer}button.primary{background:#4ebba3;color:#0d1420}button.danger{background:#5b2d38}button.ghost{background:transparent;border:1px solid #41536a}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.card{background:#172235;border:1px solid #2a3b51;border-radius:16px;padding:16px;margin:12px 0}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:440px){.grid{grid-template-columns:1fr}}label{display:grid;gap:6px;color:#b9c7d8;font-size:13px;font-weight:600}input,select,textarea{background:#0e1827;color:#f2f6ff;border:1px solid #40506a;border-radius:10px;padding:12px;width:100%;font:inherit}input[type=checkbox]{width:auto}.line{display:flex;justify-content:space-between;gap:12px;align-items:center}.line>*{min-width:0}.money{font-weight:800;color:#74dfc1}.pill{display:inline-block;border-radius:20px;background:#263f48;color:#8ce6cc;padding:4px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{color:#aebbd0;padding:30px 12px;text-align:center;border:1px dashed #43546a;border-radius:14px}.sub{border-left:2px solid #3b5268;padding-left:12px;margin:12px 0}.summary{font-size:26px;font-weight:800;color:#8ce6cc}.error{color:#ffadb7}.hint{font-size:12px;color:#a5b5c9}.part{border:1px solid #3a4b61;border-radius:12px;padding:12px;margin:10px 0}.hidden{display:none!important}hr{border:0;border-top:1px solid #34465b;margin:16px 0}.section-title{margin:20px 0 8px}button:disabled{opacity:.45;cursor:not-allowed}footer{font-size:12px;color:#9aabc0;text-align:center;padding:20px} .notice{padding:12px;background:#23394b;border-radius:12px;font-size:13px;color:#c9e9e0}
</style></head><body><header><div class="brand">HADISH WORKS</div><h1>Manager <span class="pill">Personal · v4</span></h1></header><nav class="tabs" id="tabs"></nav><main id="app"></main><script>
const KEY='hadish-works-manager-v1';const DEFAULT={settings:{printer:'Bambu Lab P2S Combo + AMS',purchase:1200,life:5000,power:200,electricity:.284977,maintenance:.10,labour:25,designRate:35,waste:5,overhead:.5,margin:40},filaments:[],components:[],products:[]};let db=load(),tab='dashboard',selectedProduct=null,editing=null,draft=null,editingRecordId=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.settings&&Array.isArray(x.products)?x:structuredClone(DEFAULT)}catch{return structuredClone(DEFAULT)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));}function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '$'+(Number(v)||0).toFixed(2)}function num(v){return Math.max(0,Number(v)||0)}function today(){return new Date().toLocaleString('en-AU')}function field(name,label,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function select(name,label,opts,value){return `<label>${label}<select name="${name}">${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`}function button(label,action,klass=''){return `<button class="${klass}" onclick="${action}">${label}</button>`}function options(items){return items.map(x=>({value:x.id,label:x.name}))}function fName(x){return [x.brand,x.material,x.color].filter(Boolean).join(' · ')}function itemBatch(item,bid){return item?.batches.find(b=>b.id===bid)}function render(){document.getElementById('tabs').innerHTML=[['dashboard','Overview'],['filaments','Filaments'],['components','Components'],['products','Products'],['settings','Settings']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');document.getElementById('app').innerHTML=tab==='dashboard'?dashboard():tab==='filaments'?library('filaments'):tab==='components'?library('components'):tab==='products'?productsView():settingsView();}function go(t){tab=t;selectedProduct=null;editing=null;draft=null;editingRecordId=null;render()}function dashboard(){let records=db.products.flatMap(p=>p.records);return `<h2>Overview</h2>${backupReminder()}<div class="grid"><div class="card"><small>Products</small><div class="summary">${db.products.length}</div></div><div class="card"><small>Cost records</small><div class="summary">${records.length}</div></div><div class="card"><small>Filaments</small><div class="summary">${db.filaments.length}</div></div><div class="card"><small>Components</small><div class="summary">${db.components.length}</div></div></div><div class="card"><h3>Printer running cost</h3><div class="summary">${money(machineRate(db.settings))} / hr</div><small>Electricity ${money(db.settings.power/1000*db.settings.electricity)} · Depreciation ${money(db.settings.purchase/db.settings.life)} · Maintenance ${money(db.settings.maintenance)}</small></div><div class="notice">Your data is stored locally. Backups are manual. Export a JSON backup at least every 7 days and keep another copy outside your phone (for example in Google Drive).</div><div class="actions">${button('Add filament',"go('filaments')",'primary')}${button('Add product',"go('products')")}</div>`}function machineRate(s){return num(s.power)/1000*num(s.electricity)+(num(s.life)>0?num(s.purchase)/num(s.life):0)+num(s.maintenance)}
function library(kind){let isF=kind==='filaments',items=db[kind];return `<div class="toolbar"><h2>${isF?'Filament':'Component'} Library</h2>${button('+ Add '+(isF?'filament':'component'),`openItem('${kind}')`,'primary')}</div>${editing?.kind===kind?itemForm(kind):''}${items.length?items.map(x=>`<div class="card"><div class="line"><div><strong>${esc(isF?fName(x):x.name)}</strong><br><small>${esc(isF?'Net spool weight: '+x.weight+' g':x.unit||'each')}</small></div>${button('Add purchase',`openBatch('${kind}','${x.id}')`)}</div>${x.batches.map((b,i)=>`<div class="sub line"><span><small>Purchase #${i+1} · ${esc(b.date||'')}<br>${esc(b.store||'Supplier not set')}</small><br>${money(b.price)} ${b.qty?'· '+esc(b.qty)+' '+(isF?'roll(s)':esc(x.unit||'units')):''}</span><span style="text-align:right"><strong>${money(b.price/(isF?num(x.weight)*num(b.qty):num(b.qty)||1))}/${isF?'g':'unit'}</strong><br>${button('Edit',`openBatch('${kind}','${x.id}','${b.id}')`)}</span></div>`).join('')}${editing?.kind===kind+'Batch'&&editing.item===x.id?batchForm(kind,x):''}<div class="actions">${button('Edit',`openItem('${kind}','${x.id}')`)}${button('Delete',`deleteItem('${kind}','${x.id}')`,'danger')}</div></div>`).join(''):'<div class="empty">No items yet. Add your first one.</div>'}`}
function openItem(kind,itemId){editing={kind,item:itemId||null};render();window.scrollTo(0,0)}function itemForm(kind){let x=db[kind].find(x=>x.id===editing.item)||{},f=kind==='filaments';return `<form class="card stack" onsubmit="submitItem(event,'${kind}','${x.id||''}')"><h3>${x.id?'Edit':'New'} ${f?'filament':'component'}</h3>${f?`<div class="grid">${field('brand','Brand',x.brand||'')}${field('material','Material',x.material||'PLA')}${field('color','Colour',x.color||'')}${field('weight','Net spool weight (g)',x.weight||1000,'number','min="0.01" step="any" required')}</div>`:`${field('name','Component name',x.name||'','text','required')}${field('unit','Unit (e.g. each, pack)',x.unit||'each')}`}<div class="actions"><button class="primary">Save</button>${button('Cancel',"editing=null;render()")}</div></form>`}function submitItem(e,kind,itemId){e.preventDefault();let d=new FormData(e.target),x=db[kind].find(x=>x.id===itemId);if(!x){x={id:id(),batches:[]};db[kind].push(x)}if(kind==='filaments'){Object.assign(x,{brand:d.get('brand').trim(),material:d.get('material').trim(),color:d.get('color').trim(),weight:num(d.get('weight'))})}else Object.assign(x,{name:d.get('name').trim(),unit:d.get('unit').trim()});save();editing=null;render()}
function openBatch(kind,item,batchId=null){editing={kind:kind+'Batch',item,batchId};render()}
function batchForm(kind,x){let isF=kind==='filaments',b=x.batches.find(b=>b.id===editing.batchId),isEdit=!!b;return `<form class="stack part" onsubmit="submitBatch(event,'${kind}','${x.id}')"><h3>${isEdit?'Edit purchase':'Add purchase'}</h3>${isEdit?'<div class="notice">Existing cost records keep their original saved prices. Future calculations will use the updated purchase details.</div>':''}<div class="grid">${field('price','Total purchase price (AUD)',b?.price??0,'number','min="0" step="any" required')}${field('qty',isF?'Number of rolls':'Quantity purchased',b?.qty??1,'number','min="1" step="1" required')}${field('date','Date',b?.date??new Date().toISOString().slice(0,10),'date')}${field('store','Purchased from (optional)',b?.store??'')}</div><small>${isF?'For multiple identical rolls, the total price is divided by the number of rolls and net spool weight.':'Price per unit is calculated from total purchase price / quantity.'}</small><div class="actions"><button class="primary">${isEdit?'Save changes':'Save purchase'}</button>${button('Cancel','editing=null;render()')}</div></form>`}
function submitBatch(e,kind,item){e.preventDefault();let d=new FormData(e.target),x=db[kind].find(x=>x.id===item),existing=x.batches.find(b=>b.id===editing.batchId);let details={price:num(d.get('price')),qty:num(d.get('qty')),date:d.get('date'),store:d.get('store')};if(existing){if(!confirm('Update this purchase? Previously saved cost records will stay unchanged.'))return;Object.assign(existing,details)}else x.batches.push({id:id(),...details});save();editing=null;render()}
function deleteItem(kind,item){if(!confirm('Delete this library item? Existing saved cost records will remain unchanged.'))return;db[kind]=db[kind].filter(x=>x.id!==item);save();render()}
function productsView(){if(draft)return recordEditor();if(selectedProduct)return productDetail();return `<div class="toolbar"><h2>Products</h2>${button('+ New product','newProduct()','primary')}</div>${editing?.kind==='product'?productForm():''}${db.products.length?db.products.map(p=>`<div class="card line"><div><strong>${esc(p.name)}</strong><br><small>${p.records.length} cost record(s) · ${esc(p.sku||'No SKU')}</small></div>${button('Open',`selectedProduct='${p.id}';editing=null;render()`,'primary')}</div>`).join(''):'<div class="empty">Add a product to start calculating costs.</div>'}`}
function newProduct(){editing={kind:'product'};render()}function productForm(){return `<form class="card stack" onsubmit="submitProduct(event)"><h3>New Product</h3>${field('name','Product name','','text','required')}${field('sku','SKU (optional)')}${field('designHours','Design time (hours)',0,'number','min="0" step="any"')}${field('designRate','Design rate (AUD/hour)',db.settings.designRate,'number','min="0" step="any"')}${field('designExtra','Extra design costs (AUD)',0,'number','min="0" step="any"')}${field('expected','Expected sales (units)',20,'number','min="1" step="1" required')}<div class="actions"><button class="primary">Create product</button>${button('Cancel','editing=null;render()')}</div></form>`}function submitProduct(e){e.preventDefault();let d=new FormData(e.target);let p={id:id(),name:d.get('name').trim(),sku:d.get('sku'),designHours:num(d.get('designHours')),designRate:num(d.get('designRate')),designExtra:num(d.get('designExtra')),expected:Math.max(1,num(d.get('expected'))),records:[]};db.products.push(p);save();editing=null;selectedProduct=p.id;render()}
function current(){return db.products.find(x=>x.id===selectedProduct)}function productDetail(){let p=current(),latest=p.records.at(-1);return `<div class="actions">${button('← Products',"selectedProduct=null;render()")}${button('Edit design','editDesign()')}</div><h2>${esc(p.name)}</h2><small>${esc(p.sku||'')} · Expected sales: ${p.expected} · Design cost per unit: ${money(designPerUnit(p))}</small><div class="card"><h3>Latest cost</h3><div class="summary">${latest?money(latest.cost.total):'—'}</div><small>${latest?'Record #'+p.records.length+' · '+esc(latest.date):'No records yet'}</small><div class="actions">${button('+ New Cost Record',"newRecord()",'primary')}${latest?button('Copy previous record',"newRecord(true)") :''}</div></div>${editing?.kind==='design'?designForm(p):''}<h3 class="section-title">Cost History</h3>${p.records.length?p.records.slice().reverse().map((r,i)=>`<div class="card"><div class="line"><div><strong>Record #${p.records.length-i}</strong><br><small>${esc(r.date)} · ${esc(r.mode)}</small></div><div class="money">${money(r.cost.total)}</div></div><div class="line"><small>Suggested: ${money(r.cost.suggested)}</small><small>Actual: ${r.actualPrice===null?'—':money(r.actualPrice)}</small></div><div class="actions">${button('Details',`showRecord('${r.id}')`)}${button('Edit',`editCostRecord('${r.id}')`)}${button('Copy',`newRecordFrom('${r.id}')`)}</div></div>`).join(''):'<div class="empty">No cost records yet.</div>'}`}
function designPerUnit(p){return (num(p.designHours)*num(p.designRate)+num(p.designExtra))/Math.max(1,num(p.expected))}function editDesign(){editing={kind:'design'};render()}function designForm(p){return `<form class="card stack" onsubmit="saveDesign(event)"><h3>Edit product design cost</h3>${field('designHours','Design hours',p.designHours,'number','min="0" step="any"')}${field('designRate','Hourly rate',p.designRate,'number','min="0" step="any"')}${field('designExtra','Extra costs',p.designExtra,'number','min="0" step="any"')}${field('expected','Expected sales',p.expected,'number','min="1" step="1"')}<div class="actions"><button class="primary">Save</button>${button('Cancel','editing=null;render()')}</div></form>`}function saveDesign(e){e.preventDefault();let d=new FormData(e.target),p=current();for(let k of ['designHours','designRate','designExtra','expected'])p[k]=num(d.get(k));p.expected=Math.max(1,p.expected);save();editing=null;render()}
function newRecord(copy=false){editingRecordId=null;let p=current(),r=copy?p.records.at(-1):null;draft=r?JSON.parse(JSON.stringify(r.input)):{mode:'quick',parts:[{name:'Main print',filamentId:'',batchId:'',grams:0,hours:0}],extras:[],labourMinutes:0,packaging:0,settings:{...db.settings},actualPrice:''};draft.settings={...db.settings,...draft.settings};render()}function newRecordFrom(rid){editingRecordId=null;let r=current().records.find(x=>x.id===rid);draft=JSON.parse(JSON.stringify(r.input));render()}function editCostRecord(rid){let r=current().records.find(x=>x.id===rid);if(!r)return;editingRecordId=rid;draft=JSON.parse(JSON.stringify(r.input));draft.settings={...db.settings,...draft.settings};draft.actualPrice=r.actualPrice??'';render()}function filOpts(value){return select('filament','Filament',[{value:'',label:'Select filament'},...db.filaments.map(x=>({value:x.id,label:fName(x)}))],value)}function batchOpts(kind,itemId,bid){let item=db[kind].find(x=>x.id===itemId);return select('batch','Purchase',[{value:'',label:'Select purchase'},...(item?.batches||[]).map((b,i)=>({value:b.id,label:`#${i+1} · ${money(b.price)} · ${b.date||''}`}))],bid)}
function recordEditor(){let p=current();return `<div class="actions">${button('← Cancel',"draft=null;editingRecordId=null;render()")}</div><h2>${editingRecordId?'Edit Cost Record':'New Cost Record'}</h2><div class="notice">${editingRecordId?'Editing this record will update its saved cost and keep its original record number. Other records remain unchanged.':'Each saved record is an independent historical snapshot. Changes here will not overwrite older records.'}</div><div class="card"><div class="line"><h3>Entry mode</h3>${select('mode','',[{value:'quick',label:'Quick Add'},{value:'detailed',label:'Detailed Add'}],draft.mode).replace('name="mode"','name="mode" onchange="draft.mode=this.value;if(this.value==&quot;quick&quot;)draft.parts=draft.parts.slice(0,1);render()"')}</div><small>Quick Add uses one print part. Detailed Add supports multiple separately named parts.</small></div><h3>Printed Parts</h3>${draft.parts.map((part,i)=>`<div class="card stack"><div class="line"><strong>Part ${i+1}</strong>${draft.mode==='detailed'?button('Remove',`removePart(${i})`,'danger'):''}</div>${draft.mode==='detailed'?`<label>Part name<input value="${esc(part.name)}" onchange="updatePart(${i},'name',this.value)"></label>`:''}<label>Filament<select onchange="updatePart(${i},'filamentId',this.value);draft.parts[${i}].batchId='';render()"><option value="">Select filament</option>${db.filaments.map(x=>`<option value="${x.id}" ${x.id===part.filamentId?'selected':''}>${esc(fName(x))}</option>`).join('')}</select></label><label>Purchase batch<select onchange="updatePart(${i},'batchId',this.value);render()"><option value="">Select purchase</option>${(db.filaments.find(x=>x.id===part.filamentId)?.batches||[]).map((b,j)=>`<option value="${b.id}" ${b.id===part.batchId?'selected':''}>#${j+1} · ${money(b.price)} (${b.qty} rolls)</option>`).join('')}</select></label><div class="grid"><label>Filament used (g)<input type="number" min="0" step="any" value="${part.grams}" onchange="updatePart(${i},'grams',num(this.value));refreshTotals()"></label><label>Print time (hours)<input type="number" min="0" step="any" value="${part.hours}" onchange="updatePart(${i},'hours',num(this.value));refreshTotals()"></label></div></div>`).join('')}${draft.mode==='detailed'?button('+ Add printed part','addPart()'):''}<h3 class="section-title">Components</h3>${draft.extras.map((x,i)=>`<div class="card stack"><div class="line"><strong>Component ${i+1}</strong>${button('Remove',`draft.extras.splice(${i},1);render()`,'danger')}</div><label>Component<select onchange="draft.extras[${i}].componentId=this.value;draft.extras[${i}].batchId='';render()"><option value="">Select component</option>${db.components.map(c=>`<option value="${c.id}" ${c.id===x.componentId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Purchase<select onchange="draft.extras[${i}].batchId=this.value;refreshTotals()"><option value="">Select purchase</option>${(db.components.find(c=>c.id===x.componentId)?.batches||[]).map((b,j)=>`<option value="${b.id}" ${b.id===x.batchId?'selected':''}>#${j+1} · ${money(b.price)} / ${b.qty} units</option>`).join('')}</select></label><label>Quantity used<input type="number" min="0" step="any" value="${x.qty}" onchange="draft.extras[${i}].qty=num(this.value);refreshTotals()"></label></div>`).join('')}${button('+ Add component','addExtra()')}<div class="card stack"><h3>Other production costs</h3><div class="grid"><label>Hands-on labour (minutes)<input type="number" min="0" step="any" value="${draft.labourMinutes}" onchange="draft.labourMinutes=num(this.value);refreshTotals()"></label><label>Packaging (AUD)<input type="number" min="0" step="any" value="${draft.packaging}" onchange="draft.packaging=num(this.value);refreshTotals()"></label></div><details><summary>Override cost rates for this record</summary><div class="stack" style="margin-top:12px">${['power','electricity','purchase','life','maintenance','labour','waste','overhead','margin'].map(k=>`<label>${k}<input type="number" min="0" step="any" value="${draft.settings[k]}" onchange="draft.settings['${k}']=num(this.value);refreshTotals()"></label>`).join('')}</div></details></div><div id="totals">${totalsHtml()}</div><div class="card stack"><label>Actual selling price (optional, AUD)<input type="number" min="0" step="any" value="${esc(draft.actualPrice)}" onchange="draft.actualPrice=this.value"></label>${button(editingRecordId?'Save Changes':'Save as New Cost Record','saveRecord()','primary')}</div>`}
function updatePart(i,k,v){draft.parts[i][k]=v}function addPart(){draft.parts.push({name:'Part '+(draft.parts.length+1),filamentId:'',batchId:'',grams:0,hours:0});render()}function removePart(i){if(draft.parts.length===1)return;draft.parts.splice(i,1);render()}function addExtra(){draft.extras.push({componentId:'',batchId:'',qty:1});render()}function compute(input,p){let filament=0,components=0,hours=0,valid=true;for(let a of input.parts){hours+=num(a.hours);if(num(a.grams)>0){let f=db.filaments.find(x=>x.id===a.filamentId),b=itemBatch(f,a.batchId);if(!f||!b||!num(f.weight)||!num(b.qty))valid=false;else filament+=num(a.grams)*num(b.price)/(num(f.weight)*num(b.qty))}}for(let x of input.extras){if(num(x.qty)>0){let c=db.components.find(y=>y.id===x.componentId),b=itemBatch(c,x.batchId);if(!c||!b||!num(b.qty))valid=false;else components+=num(x.qty)*num(b.price)/num(b.qty)}}let s=input.settings,elec=hours*num(s.power)/1000*num(s.electricity),depreciation=hours*(num(s.life)?num(s.purchase)/num(s.life):0),maintenance=hours*num(s.maintenance),labour=num(input.labourMinutes)/60*num(s.labour),design=designPerUnit(p),waste=(filament+components)*num(s.waste)/100,overhead=num(s.overhead),packaging=num(input.packaging);let total=filament+components+elec+depreciation+maintenance+labour+design+waste+overhead+packaging;return {filament,components,elec,depreciation,maintenance,labour,design,waste,overhead,packaging,total,suggested:num(s.margin)<100?total/(1-num(s.margin)/100):null,valid,hours}}
function totalsHtml(){let c=compute(draft,current());return `<div class="card"><h3>Cost Breakdown</h3>${[['Filament',c.filament],['Components',c.components],['Electricity',c.elec],['Depreciation',c.depreciation],['Maintenance',c.maintenance],['Hands-on labour',c.labour],['Design allocation',c.design],['Packaging',c.packaging],['Waste allowance',c.waste],['Overhead',c.overhead]].map(([k,v])=>`<div class="line"><small>${k}</small><strong>${money(v)}</strong></div>`).join('')}<hr><div class="line"><strong>Total cost</strong><span class="summary">${money(c.total)}</span></div><div class="line"><strong>Suggested selling price</strong><strong>${c.suggested===null?'—':money(c.suggested)}</strong></div>${!c.valid?'<p class="error">Choose a valid purchase for each used filament/component.</p>':''}</div>`}function refreshTotals(){let e=document.getElementById('totals');if(e)e.innerHTML=totalsHtml()}
function snapshotInput(inp){let copy=JSON.parse(JSON.stringify(inp));copy.parts=copy.parts.map(a=>{let f=db.filaments.find(x=>x.id===a.filamentId),b=itemBatch(f,a.batchId);return {...a,filamentName:f?fName(f):'',purchasePrice:b?.price??null,purchaseQty:b?.qty??null,spoolWeight:f?.weight??null}});copy.extras=copy.extras.map(x=>{let c=db.components.find(y=>y.id===x.componentId),b=itemBatch(c,x.batchId);return {...x,componentName:c?.name||'',purchasePrice:b?.price??null,purchaseQty:b?.qty??null}});return copy}
function saveRecord(){let p=current(),c=compute(draft,p);if(!c.valid){alert('Select a valid filament/component purchase for each used item.');return}if(!draft.parts.length){alert('Add at least one printed part.');return}let actual=draft.actualPrice===''?null:num(draft.actualPrice);if(editingRecordId){let r=p.records.find(x=>x.id===editingRecordId);if(!r)return;if(!confirm('Save changes to this existing Cost Record?'))return;Object.assign(r,{mode:draft.mode,input:snapshotInput(draft),cost:c,actualPrice:actual,editedAt:today()})}else{p.records.push({id:id(),date:today(),mode:draft.mode,input:snapshotInput(draft),cost:c,actualPrice:actual})}save();draft=null;editingRecordId=null;render()}
function showRecord(rid){let p=current(),r=p.records.find(x=>x.id===rid);let lines=[['Filament',r.cost.filament],['Components',r.cost.components],['Electricity',r.cost.elec],['Depreciation',r.cost.depreciation],['Maintenance',r.cost.maintenance],['Labour',r.cost.labour],['Design',r.cost.design],['Packaging',r.cost.packaging],['Waste',r.cost.waste],['Overhead',r.cost.overhead]];let detail=r.input.parts.map(a=>`${a.name}: ${a.filamentName||'No filament'}, ${a.grams} g, ${a.hours} h, purchase ${a.purchasePrice??'—'}`).concat(r.input.extras.map(x=>`${x.componentName}: ${x.qty} units, purchase ${x.purchasePrice??'—'}`));alert('COST RECORD · '+r.date+'\n\n'+detail.join('\n')+'\n\n'+lines.map(([k,v])=>k+': '+money(v)).join('\n')+'\n\nTOTAL: '+money(r.cost.total)+'\nSuggested: '+money(r.cost.suggested)+'\nActual: '+(r.actualPrice===null?'—':money(r.actualPrice)))}
function settingsView(){let s=db.settings;return `<h2>Settings</h2><form class="card stack" onsubmit="saveSettings(event)"><h3>Default Cost Rates</h3>${field('printer','Printer name',s.printer)}<div class="grid">${[['purchase','Printer purchase price (AUD)'],['life','Expected life (hours)'],['power','Average printing power (W)'],['electricity','Electricity rate (AUD/kWh)'],['maintenance','Maintenance (AUD/hour)'],['labour','Hands-on labour (AUD/hour)'],['designRate','Design labour (AUD/hour)'],['waste','Waste allowance (%)'],['overhead','Overhead per product (AUD)'],['margin','Target profit margin (%)']].map(([k,label])=>field(k,label,s[k],'number','min="0" step="any"')).join('')}</div><small>Printer purchase $1,200; electricity tariff $0.284977/kWh from your Origin bill. 200W, 5,000h and $0.10 maintenance/hour are provisional estimates. No channel-specific selling fees in v1.</small><button class="primary">Save settings</button></form><div class="card stack"><h3>Backup & Restore</h3><div class="notice">Export your complete data as JSON every 7 days. Save a second copy outside this phone. The reminder appears when you open the app; it is not a background notification.</div>${button('Export JSON backup','exportData()','primary')}<label>Import backup JSON<input type="file" accept="application/json,.json" onchange="importData(event)"></label></div><footer>Hadish Works Manager · Personal PWA v5</footer>`}function saveSettings(e){e.preventDefault();let d=new FormData(e.target);for(let k in db.settings)db.settings[k]=k==='printer'?d.get(k):num(d.get(k));save();render();alert('Settings saved. Existing cost records are unchanged.')}const BACKUP_DATE_KEY='hadish_last_backup_export_v5';
function backupReminder(){let t=Number(localStorage.getItem(BACKUP_DATE_KEY)||0),days=t?Math.floor((Date.now()-t)/86400000):null;return `<div class="notice" style="margin:12px 0">${days===null?'No backup export recorded on this device.':days>=7?'Backup due! Last export was '+days+' day(s) ago.':'Last backup export: '+days+' day(s) ago. Next reminder in '+(7-days)+' day(s).'} <button onclick="go('settings')">Backup & Restore</button></div>`}
function exportData(){try{let a=document.createElement('a'),blob=new Blob([JSON.stringify({format:'hadish-manager-backup',version:5,createdAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='Hadish-Backup-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);localStorage.setItem(BACKUP_DATE_KEY,String(Date.now()));render();alert('Backup download requested. Check your Downloads folder and copy the file to another location such as Google Drive.');}catch(e){alert('Backup export failed: '+e.message)}}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format==='hadish-manager-backup'&&x.data)x=x.data;if(!x.settings||!Array.isArray(x.products)||!Array.isArray(x.filaments)||!Array.isArray(x.components))throw Error('Invalid backup');if(!confirm('Replace ALL current data with this backup?'))return;db=x;save();render();alert('Backup restored. Export a fresh backup and keep it outside this device.')}catch(err){alert('Could not import backup: '+err.message)}}
render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script></body></html>
